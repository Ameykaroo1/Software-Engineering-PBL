version: '3.8'

services:
  mysql:
    image: mysql:8.0
    container_name: medicore-mysql
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: password
      MYSQL_DATABASE: medicore_db
      MYSQL_USER: medicore_user
      MYSQL_PASSWORD: medicore_password
    ports:
      - '3306:3306'
    volumes:
      - mysql_data:/var/lib/mysql
    command: --default-authentication-plugin=mysql_native_password
    healthcheck:
      test: ['CMD', 'mysqladmin', 'ping', '-h', 'localhost', '-u', 'root', '-ppassword']
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  mysql_data:
